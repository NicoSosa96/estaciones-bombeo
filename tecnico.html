<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Técnico - Estaciones</title>
  <style>
    body { font-family: sans-serif; background: #eef2f5; padding: 15px; margin: 0; }
    .card { max-width: 460px; margin: auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,.1); }
    h2 { color: #1e3a5f; text-align: center; margin-top: 0; }
    label { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; }
    input, select, textarea { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button { width: 100%; background: #1e3a5f; color: #fff; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 16px; cursor: pointer; }
    .btn-sec { background: #6c757d; margin-top: 8px; padding: 10px; font-size: 14px; }
    .btn-sync { background: #e67e22; display: none; margin-top: 8px; }
    .bar { text-align: center; font-size: 13px; padding: 8px; border-radius: 6px; margin-bottom: 10px; font-weight: bold; }
    .on { background: #d4edda; color: #155724; } .off { background: #f8d7da; color: #721c24; }
    #msg { text-align: center; margin-top: 12px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <div id="net" class="bar on">🟢 Con señal</div>
    <button id="btnSync" class="btn-sync" onclick="sync()">🔄 Sincronizar (<span id="cnt">0</span>)</button>

    <div id="p1">
      <h2>Inicio de Recorrido</h2>
      <label>PIN de Técnico:</label><input type="password" id="pin">
      <label>¿Qué estación vas a medir hoy?</label>
      <select id="selEst">
        <option value="Tapia">Tapia</option>
        <option value="Mitre">Mitre</option>
        <option value="Torretanque">Torretanque</option>
        <option value="Ayacucho">Ayacucho</option>
      </select>
      <button onclick="iniciar()">Comenzar Medición →</button>
    </div>

    <div id="p2" style="display:none;">
      <h2 id="titEst"></h2>
      <label>Bomba:</label><select id="selBomba"></select>
      <div class="grid">
        <div><label>Temp 1 (°C):</label><input type="number" step="0.1" id="t1"></div>
        <div><label>Temp 2 (°C):</label><input type="number" step="0.1" id="t2"></div>
        <div><label>Temp 3 (°C):</label><input type="number" step="0.1" id="t3"></div>
        <div><label>Temp 4 (°C):</label><input type="number" step="0.1" id="t4"></div>
        <div><label>RPM:</label><input type="number" id="rpm"></div>
        <div><label>Horas uso:</label><input type="number" id="hrs"></div>
      </div>
      <label>¿Fue lubricada?</label>
      <select id="lub"><option value="No">No</option><option value="Sí">Sí</option></select>
      <label>Estado:</label>
      <select id="est">
        <option value="Normal">🟢 Normal</option>
        <option value="Irregularidad leve">🟡 Irregularidad leve</option>
        <option value="Crítico">🔴 Crítico</option>
      </select>
      <label>Observación:</label><textarea id="obs" rows="3"></textarea>
      <button id="btnG" onclick="enviar()">Guardar Medición</button>
      <button class="btn-sec" onclick="volver()">← Cambiar Estación</button>
    </div>
    <div id="msg"></div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz1VKXWuWOdET9svAM1BQ0l0xrWGpI37xZXXNs2SJq2x9Ifl_pDgzFBKjGb2aoLe3X8Lg/exec";
    const BOMBAS_POR_EST = { "Tapia": 4, "Mitre": 2, "Torretanque": 3, "Ayacucho": 4 };
    let estAct = "", pinAct = "";

    function red() {
      const b = document.getElementById("net");
      b.className = navigator.onLine ? "bar on" : "bar off";
      b.innerText = navigator.onLine ? "🟢 Con señal" : "🔴 Sin señal (Modo Offline)";
      actCola();
    }
    window.addEventListener('online', red); window.addEventListener('offline', red); window.onload = red;

    function iniciar() {
      pinAct = document.getElementById("pin").value;
      if (!pinAct) return alert("Ingresa el PIN");
      estAct = document.getElementById("selEst").value;
      document.getElementById("titEst").innerText = "Estación " + estAct;
      const sb = document.getElementById("selBomba"); sb.innerHTML = "";
      for (let i = 1; i <= BOMBAS_POR_EST[estAct]; i++) {
        const o = document.createElement("option"); o.value = "Bomba " + i; o.innerText = "Bomba " + i; sb.appendChild(o);
      }
      document.getElementById("p1").style.display = "none";
      document.getElementById("p2").style.display = "block";
    }

    function volver() {
      document.getElementById("msg").innerText = "";
      document.getElementById("p2").style.display = "none";
      document.getElementById("p1").style.display = "block";
    }

    function actCola() {
      const c = JSON.parse(localStorage.getItem("cola_bombas") || "[]");
      document.getElementById("cnt").innerText = c.length;
      document.getElementById("btnSync").style.display = c.length > 0 ? "block" : "none";
    }

    function limpiar() {
      ["t1","t2","t3","t4","rpm","hrs","obs"].forEach(id => document.getElementById(id).value = "");
    }

    function guardarLocal(d) {
      const c = JSON.parse(localStorage.getItem("cola_bombas") || "[]");
      c.push(d); localStorage.setItem("cola_bombas", JSON.stringify(c));
      actCola(); limpiar();
      document.getElementById("msg").innerText = "💾 Guardado offline (" + d.bomba + ")";
    }

    function enviar() {
      const h = new Date();
      const fecha = String(h.getDate()).padStart(2,'0') + "/" + String(h.getMonth()+1).padStart(2,'0') + "/" + h.getFullYear();
      const d = {
        pin: pinAct, fecha: fecha, estacion: estAct,
        bomba: document.getElementById("selBomba").value,
        t1: document.getElementById("t1").value, t2: document.getElementById("t2").value,
        t3: document.getElementById("t3").value, t4: document.getElementById("t4").value,
        rpm: document.getElementById("rpm").value, horas: document.getElementById("hrs").value,
        lubricada: document.getElementById("lub").value, estado: document.getElementById("est").value,
        obs: document.getElementById("obs").value
      };
      if (!d.t1 || !d.rpm) return alert("Completa Temp 1 y RPM");
      if (!navigator.onLine) return guardarLocal(d);

      const btn = document.getElementById("btnG"); btn.disabled = true;
      document.getElementById("msg").innerText = "Guardando...";
      fetch(API_URL, { method: "POST", body: JSON.stringify(d) })
        .then(r => r.json())
        .then(res => {
          btn.disabled = false;
          document.getElementById("msg").innerText = res.ok ? "✅ " + res.mensaje : "❌ " + res.mensaje;
          if (res.ok) limpiar();
        })
        .catch(() => { btn.disabled = false; guardarLocal(d); });
    }

    function sync() {
      const c = JSON.parse(localStorage.getItem("cola_bombas") || "[]");
      if (!c.length || !navigator.onLine) return;
      const btn = document.getElementById("btnSync"); btn.disabled = true;
      fetch(API_URL, { method: "POST", body: JSON.stringify(c) })
        .then(r => r.json())
        .then(res => {
          btn.disabled = false;
          if (res.ok) { localStorage.removeItem("cola_bombas"); actCola(); document.getElementById("msg").innerText = "✅ Sincronizado"; }
          else document.getElementById("msg").innerText = "❌ " + res.mensaje;
        })
        .catch(() => { btn.disabled = false; alert("Error al sincronizar."); });
    }
  </script>
</body>
</html>
